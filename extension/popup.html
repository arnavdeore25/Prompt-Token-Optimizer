<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PromptSaver AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">⚡</div>
        <div>
          <h1>PromptSaver AI</h1>
          <p>Local model · Private by design</p>
        </div>
      </header>
      <div class="status">
        <i id="dot"></i>
        <div>
          <b id="status">Checking local model…</b
          ><small id="model">127.0.0.1:8765</small>
        </div>
      </div>
      <div class="hero">
        <div><span>Tokens saved</span><b id="saved">0</b></div>
        <div><span>Prompts optimized</span><b id="prompts">0</b></div>
      </div>
      <section class="card">
        <div class="row">
          <span>Average reduction</span><b id="reduction">0%</b>
        </div>
        <div class="bar"><i id="bar"></i></div>
      </section>
      <section class="card">
        <b>Privacy</b>
        <p>
          Your prompt goes to your own local model. Nothing is sent to
          PromptSaver servers.
        </p>
      </section>
      <footer>ChatGPT · Claude · Gemini</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
